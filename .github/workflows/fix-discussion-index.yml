name: 修复 Discussion 索引（评论触发版）

on:
  workflow_dispatch:

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: 批量触发索引重建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          
          echo "🔍 正在拉取所有 Open 状态的 Discussions..."
          
          # 手动分页获取（discussions API 的分页方式）
          page=1
          all_nums=""
          while true; do
            result=$(gh api "repos/$OWNER/$REPO/discussions?state=open&per_page=100&page=$page" --jq '.[].number' 2>/dev/null || true)
            [ -z "$result" ] && break
            all_nums="$all_nums"$'\n'"$result"
            page=$((page + 1))
          done
          
          nums=$(echo "$all_nums" | grep -v '^$' | sort -u)
          total=$(echo "$nums" | wc -l)
          echo "📊 共找到 $total 个 Discussion 需要修复"
          
          [ "$total" -eq 0 ] && echo "✅ 没有需要修复的" && exit 0
          
          count=0
          while read -r num; do
            count=$((count + 1))
            echo "[$count/$total] 处理 Discussion #$num"
            
            # 1. 添加一条临时评论（触发索引）
            comment_id=$(gh api --method POST "repos/$OWNER/$REPO/discussions/$num/comments" \
              -f body="." \
              --jq '.id' 2>/dev/null || echo "")
            
            if [ -n "$comment_id" ]; then
              # 2. 立即删除该评论（清理现场）
              gh api --method DELETE "repos/$OWNER/$REPO/discussions/comments/$comment_id" --silent 2>/dev/null || true
              echo "  ✅ 已触发索引刷新"
            else
              echo "  ⚠️ 跳过（可能已修复或 API 受限）"
            fi
            
            # 每 5 个休息 3 秒，避免速率限制
            if [ $((count % 5)) -eq 0 ]; then
              echo "⏳ 休息 3 秒..."
              sleep 3
            fi
          done <<< "$nums"
          
          echo ""
          echo "🎉 全部处理完成！"
          echo "⏰ 等待 3-5 分钟后，刷新博客页面验证。"
          echo ""
          echo "💡 如果仍有部分未恢复，等 10 分钟后再试（GitHub 索引是异步的）。"
